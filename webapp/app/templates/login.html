{% extends "base.html" %}{% block content %}
<div class="center" style="max-width:420px;margin:60px auto">
<h1>Welcome back</h1>
<p class="sub">Good to see you. Your recovery dashboard is right where you left it.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="stack">
<div><label>Email</label><input type="email" name="email" required></div>
<div><label>Password</label><input type="password" name="password" required></div>
<button class="btn">Log in</button>
</form>
<p class="muted"><a href="/forgot">Forgot password?</a></p>
<p class="muted" style="margin-top:8px">New here? <a href="/signup">Create your account</a></p>
</div>{% endblock %}
