{% extends "base.html" %}{% block content %}
<div class="center" style="max-width:420px;margin:60px auto">
<h1>Reset your password</h1>
<p class="sub">Enter your email and we'll send you a reset link.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/forgot" class="stack">
<div><label>Email</label><input type="email" name="email" required></div>
<button class="btn">Send reset link</button>
</form>
<p class="muted" style="margin-top:16px"><a href="/login">Back to login</a></p>
</div>{% endblock %}
