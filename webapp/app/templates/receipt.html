<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt · RecurSaathi</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f5fb;color:#241f3d;margin:0;padding:40px 16px}
.r{background:#fff;border:1px solid #e6e3f2;border-radius:16px;padding:32px;max-width:560px;margin:0 auto;box-shadow:0 10px 30px rgba(60,40,140,.08)}
h1{font-size:22px;margin:0 0 4px}.m{color:#6b6684;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px 0;border-bottom:1px solid #eee;font-size:14px;text-align:left}
.amt{font-size:26px;font-weight:800}
button{margin-top:20px;padding:10px 16px;border:0;border-radius:10px;background:#6d5df6;color:#fff;font-weight:700;cursor:pointer}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.ok{background:#e8f7ee;color:#1c7a3e}.tag.pend{background:#fff4e0;color:#9a6b00}
</style></head><body><div class="r">
<h1>Receipt</h1>
<p class="m">RecurSaathi subscription payment &middot; {{ pay.created | datetime }}</p>
<table>
<tr><th>Plan</th><td style="text-align:right;text-transform:capitalize">{{ pay.plan }}</td></tr>
<tr><th>Amount</th><td style="text-align:right" class="amt">{{ inr(pay.amount) }}</td></tr>
<tr><th>Status</th><td style="text-align:right"><span class="tag {{ 'ok' if pay.status=='confirmed' else 'pend' }}">{{ pay.status }}</span></td></tr>
<tr><th>Reference</th><td style="text-align:right">{{ pay.reference or "-" }}</td></tr>
<tr><th>Receipt ID</th><td style="text-align:right">{{ pay.id }}</td></tr>
</table>
<button data-print>Print / save as PDF</button>
<p class="m" style="margin-top:16px">Prices exclude 18% GST. This receipt reflects payments actually confirmed on the platform.</p>
</div></body></html>
