{% extends "base.html" %}{% block content %}
<div style="max-width:460px;margin:40px auto">
<h1>Create your account</h1>
<p class="sub">Takes about a minute. 14-day free trial, no card needed.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/signup" class="stack">
<div><label>Your name</label><input name="name" required></div>
<div><label>Business name</label><input name="business" required></div>
<div><label>Email</label><input type="email" name="email" required></div>
<div><label>Phone (WhatsApp number)</label><input type="tel" name="phone" required></div>
<div><label>Your UPI ID (to receive invoice payments)</label><input name="upi_vpa" placeholder="yourname@bank"></div>
<div><label>Password (min 8 characters)</label><input type="password" name="password" minlength="8" required></div>
<button class="btn">Start free trial</button>
</form>
<p class="muted" style="margin-top:16px">Already have an account? <a href="/login">Log in</a></p>
</div>{% endblock %}
